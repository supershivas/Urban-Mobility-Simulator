<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE8">
<title>Urban Mobility Simulator</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Urban Mobility Simulator">
<meta property="og:image" content="og.png">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css?v=0.9.3">
<link rel="stylesheet" href="js/lib/game.css?v=0.9.3">
<link rel="stylesheet" href="css/style.css?v=0.9.3">
</head>
<body>
<div class="jeu-ecran app" id="ecran">
  <header class="entete">
    <a class="entete-nom" id="nom-jeu" href="./" data-i18n-aria="entete.retour-titre">Urban Mobility Simulator</a>
    <span class="entete-corridor" data-i18n="entete.corridor"></span>
    <span class="entete-version" id="entete-version"></span>
    <!-- v0.8 : l'écran de jeu est épuré ; le mode expert rend les couches, l'inspecteur et les bandeaux de détail -->
    <button class="bouton entete-expert" id="bascule-expert" aria-pressed="false"><span data-i18n="expert.bouton"></span> <kbd>O</kbd></button>
    <button class="icone" id="ouvrir-menu" data-i18n-aria="pause.titre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 2.9-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.5 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.5 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-2.9 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <aside class="outils" id="outils">
    <h2 data-i18n="outils.titre"></h2>
    <div class="couches" id="couches"></div>
    <button class="bouton" id="bascule-vue" aria-pressed="false"><span id="bascule-vue-texte" data-i18n="outils.vue3d"></span> <kbd>V</kbd></button>
    <button class="bouton" id="recentrer" data-i18n="outils.recentrer"></button>
    <p class="aide" data-i18n="outils.aide"></p>
  </aside>

  <main class="carte-zone">
    <div class="carte" id="carte" role="application" data-i18n-aria="carte.libelle"></div>
    <!-- Trafic (v0.6) : les blocs dessinés par-dessus la carte (rien ne s'y clique), et les commandes du temps -->
    <canvas class="trafic-2d" id="trafic-2d" aria-hidden="true"></canvas>
    <!-- Vue 3D (three.js, chargé à la première bascule) : même corridor, mêmes objets, mêmes identifiants -->
    <div class="scene" id="scene" role="application" data-i18n-aria="scene.libelle" tabindex="0" hidden>
      <div class="scene-etiquettes" id="scene-etiquettes"></div>
      <div class="scene-echelle" id="scene-echelle" data-i18n-title="scene.echelle"></div>
      <p class="scene-legende"><span class="scene-legende-signe" aria-hidden="true"></span><span data-i18n="scene.legende"></span></p>
      <p class="scene-attente" id="scene-attente" role="status" data-i18n="scene.attente" hidden></p>
    </div>
    <!-- Outils (v0.7) : un clic ou un glisser sur une voie la transforme -->
    <div class="barre-outils" id="barre-outils" role="toolbar"></div>
    <!-- Missions (v0.8) : la carte de la mission en cours, et l'étiquette de la voie sous l'outil -->
    <section class="mission" id="mission" aria-live="polite" data-i18n-aria="mission.libelle"></section>
    <div class="survol" id="survol" hidden></div>
    <div class="trafic-hud" id="trafic-hud" role="group" data-i18n-aria="trafic.libelle" hidden>
      <button class="bouton trafic-bouton" id="trafic-pause" aria-pressed="false"><span id="trafic-pause-texte"></span> <kbd data-i18n="trafic.touche-pause"></kbd></button>
      <button class="bouton trafic-bouton" id="trafic-vitesse"><span id="trafic-vitesse-texte"></span> <kbd>X</kbd></button>
      <button class="bouton trafic-bouton" id="hud-vue"><span id="hud-vue-texte"></span> <kbd>V</kbd></button>
      <span class="trafic-horloge" id="trafic-horloge" role="status"></span>
    </div>
  </main>

  <!-- Éditeur de section transversale (v0.3) : bandeau sous la carte, rempli par js/editeur.js -->
  <section class="editeur" id="editeur" data-i18n-aria="editeur.libelle" hidden></section>

  <aside class="inspecteur" id="inspecteur" aria-live="polite">
    <div class="inspecteur-tete">
      <h2 data-i18n="inspecteur.titre"></h2>
      <button class="icone" id="deselectionner" data-i18n-aria="inspecteur.fermer" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="inspecteur-corps"><p class="vide" data-i18n="inspecteur.vide"></p></div>
  </aside>

  <footer class="statut" id="statut">
    <span id="statut-sources" data-i18n="statut.sources"></span>
    <span id="statut-emprise"></span>
    <span id="statut-donnees"></span>
    <span id="statut-flux"></span>
    <!-- Pages sert le .md en texte brut (tableaux illisibles) : le rapport s'ouvre sur github.com, qui le met en forme -->
    <a id="statut-anomalies" href="https://github.com/supershivas/Urban-Mobility-Simulator/blob/main/data/metadata/quality-report.md" target="_blank" rel="noopener"></a>
  </footer>

  <!-- Écran de chargement (section 3) : affiché d'emblée, masqué quand les données
       sont lues et la carte dessinée ; le texte est remplacé par l'erreur si le chargement échoue -->
  <div class="jeu-chargement" id="chargement" role="status" aria-live="polite">
    <span class="jeu-chargement-barre" aria-hidden="true"></span>
    <p id="chargement-texte" data-i18n="chargement">Chargement des données du corridor…</p>
  </div>

  <!-- Écran titre : pas de sous-titre (section 3) -->
  <section class="titre" id="titre">
    <h1>Urban Mobility Simulator</h1>
    <nav class="titre-menu">
      <button class="bouton" id="continuer" data-i18n="titre.continuer" hidden disabled></button>
      <button class="bouton" id="nouvelle" data-i18n="titre.nouvelle" disabled></button>
      <!-- v0.9 : un second jeu, en bêta, sur une carte vierge (beta.html) -->
      <a class="bouton titre-beta" id="beta" href="beta.html" data-i18n="titre.beta"></a>
    </nav>
    <button class="icone titre-reglages" id="ouvrir-reglages" data-i18n-aria="titre.reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3c.4-1.8 2.9-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.5 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.5 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-2.9 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </section>
</div>

<!-- Les boîtes de dialogue sont rattachées au body (section 17) -->
<dialog id="dialogue-pause" data-i18n-aria="pause.titre">
  <h2 data-i18n="pause.titre"></h2>
  <div class="menu">
    <button class="bouton" id="reprendre" data-i18n="pause.reprendre"></button>
    <button class="bouton" id="pause-aide" data-i18n="pause.aide"></button>
    <button class="bouton" id="pause-reglages" data-i18n="pause.reglages"></button>
    <button class="bouton" id="quitter" data-i18n="pause.quitter"></button>
  </div>
</dialog>

<dialog id="dialogue-aide" data-i18n-aria="aide.titre">
  <h2 data-i18n="aide.titre"></h2>
  <div id="aide-corps"></div>
  <form method="dialog"><button class="bouton" data-i18n="reglages.fermer"></button></form>
</dialog>

<dialog id="dialogue-reglages" data-i18n-aria="reglages.titre">
  <h2 data-i18n="reglages.titre"></h2>
  <label class="champ-reglage"><span data-i18n="reglages.langue"></span>
    <select id="langue"><option value="fr">Français</option><option value="en">English</option></select>
  </label>
  <hr>
  <p class="version" id="version">v…</p>
  <details>
    <summary data-i18n="reglages.versions"></summary>
    <div id="changelog"></div>
  </details>
  <div class="menu">
    <button class="bouton" id="exporter" data-i18n="reglages.exporter"></button>
    <button class="bouton" id="importer" data-i18n="reglages.importer"></button>
  </div>
  <p class="liens"><a href="atelier.html" data-i18n="reglages.atelier"></a></p>
  <form method="dialog"><button class="bouton" data-i18n="reglages.fermer"></button></form>
</dialog>

<dialog id="dialogue-confirmer">
  <p data-i18n="confirmer.texte"></p>
  <form method="dialog" class="menu">
    <button class="bouton" value="oui" data-i18n="confirmer.oui"></button>
    <button class="bouton" value="non" data-i18n="confirmer.non"></button>
  </form>
</dialog>

<div class="jeu-toast" id="toast" role="status" hidden></div>
<!-- Avant l'écran titre, i18n.js n'est peut-être pas chargé : ce filet de secours dit en deux langues ce qui bloque
     (module refusé par le navigateur, fichier introuvable, erreur) au lieu de laisser le chargement figé (vu en 0.6.0). -->
<script>
  (function () {
    var fini = function () { var c = document.getElementById('chargement'); return !c || c.hidden; };
    var dire = function (raison) {
      if (fini()) return;
      var t = document.getElementById('chargement-texte'), b = document.querySelector('#chargement .jeu-chargement-barre');
      if (b) b.hidden = true;
      if (t) t.textContent = 'Le jeu n\u2019a pas pu d\u00e9marrer : ' + raison + ' \u2014 rechargez avec Ctrl+Maj+R. / The game could not start: ' + raison + ' \u2014 reload with Ctrl+Shift+R.';
    };
    // Le navigateur signale main.js même quand c'est un module qu'il importe qui manque (ou qu'un bloqueur
    // de publicités refuse, vu en 0.6.0 avec « trafic.js ») : on suit les imports pour nommer le coupable.
    var sonder = function (url, vus) {
      if (vus[url]) return Promise.resolve(null);
      vus[url] = 1;
      return fetch(url).then(function (r) {
        if (!r.ok) return url + ' (HTTP ' + r.status + ')';
        return r.text().then(function (t) {
          var re = /^import\s[^'"]*['"](\.[^'"]+)['"]/gm, m, liste = []; // en début de ligne : pas les exemples en commentaire
          while ((m = re.exec(t))) liste.push(new URL(m[1], url).href);
          return liste.reduce(function (p, u) { return p.then(function (x) { return x || sonder(u, vus); }); }, Promise.resolve(null));
        });
      }, function () { return url + ' (bloqué : bloqueur de publicités ? / blocked: ad blocker?)'; });
    };
    var court = function (u) { return u.replace(location.href.replace(/[^/]*$/, ''), ''); };
    window.addEventListener('error', function (e) {
      var tag = e.target && e.target.tagName;
      if (tag && tag !== 'SCRIPT' && tag !== 'LINK') return; // une image manquante ne bloque rien
      var cible = e.target && e.target !== window ? (e.target.src || e.target.href) : null;
      if (!cible) { dire((e.message || 'erreur / error') + (e.filename ? ' (' + court(e.filename) + ':' + e.lineno + ')' : '')); return; }
      dire('fichier non chargé / file not loaded ' + court(cible));
      if (tag === 'SCRIPT') sonder(cible, {}).then(function (x) { if (x) dire('fichier non chargé / file not loaded ' + court(x)); });
    }, true);
    window.addEventListener('unhandledrejection', function (e) { dire(String((e.reason && e.reason.message) || e.reason)); });
    setTimeout(function () {
      if (fini()) return;
      var t = document.getElementById('chargement-texte');
      if (t && !/Ctrl/.test(t.textContent)) t.textContent += ' (30 s : si rien ne bouge, Ctrl+Maj+R / if nothing moves, Ctrl+Shift+R)';
    }, 30000);
  })();
</script>
<script type="module" src="js/main.js?v=0.9.3"></script>
</body>
</html>
