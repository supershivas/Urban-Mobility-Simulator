<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E5DC">
<title>Urban Mobility Simulator — Carte blanche (bêta)</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="js/lib/game.css?v=0.9.8">
<link rel="stylesheet" href="css/beta.css?v=0.9.8">
</head>
<body>
<!-- Jeu beta « Carte blanche » (v0.9.0) : une carte vierge en 3D, une route, et ce que le joueur y construit.
     Ouvert depuis le bouton « Bêta » de l'écran titre (index.html). -->
<div class="jeu-ecran beta" id="ecran">
  <div class="beta-vue" id="vue" role="application" data-i18n-aria="scene.libelle" tabindex="0">
    <div class="beta-etiquette" id="etiquette" hidden></div>
  </div>

  <header class="beta-tete">
    <a class="bouton beta-retour" href="./" id="retour"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="retour"></span></a>
    <h1 class="beta-titre"><span data-i18n="titre"></span> <small data-i18n="beta"></small></h1>
    <span class="beta-version" id="version"></span>
  </header>

  <!-- Outils groupés par usage (Jérôme, v0.9.2) : une couleur par groupe, une icône par outil -->
  <nav class="beta-outils" id="outils" role="toolbar" data-i18n-aria="outils.libelle">
    <div class="beta-groupe" data-groupe="routes" role="group" data-i18n-aria="groupe.routes">
      <span class="beta-groupe-nom" data-i18n="groupe.routes"></span>
      <button class="bouton beta-outil" data-outil="route" data-i18n-title="outil.route" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-8 6-14 16-16"/><path class="tiret" d="M8 17c1-4 4-8 9-10"/></svg>
        <span data-i18n="outil.route"></span> <kbd>1</kbd></button>
      <button class="bouton beta-outil" data-outil="voies" data-i18n-title="outil.voies" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16M21 4v16M12 4v16"/><path class="tiret" d="M7.5 4v16M16.5 4v16"/></svg>
        <span data-i18n="outil.voies"></span> <kbd>2</kbd></button>
      <button class="bouton beta-outil" data-outil="demolir" data-i18n-title="outil.demolir" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        <span data-i18n="outil.demolir"></span> <kbd>3</kbd></button>
      <button class="bouton beta-outil" data-outil="ilot" data-i18n-title="outil.ilot" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18M20 3v18"/><rect x="10" y="5" width="4" height="14" rx="2"/></svg>
        <span data-i18n="outil.ilot"></span> <kbd>8</kbd></button>
    </div>
    <div class="beta-groupe" data-groupe="velo" role="group" data-i18n-aria="groupe.velo">
      <span class="beta-groupe-nom" data-i18n="groupe.velo"></span>
      <button class="bouton beta-outil" data-outil="velo" data-i18n-title="outil.velo" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h6l2 7M10 9l2 7 4-7M15 6h3"/></svg>
        <span data-i18n="outil.velo"></span> <kbd>4</kbd></button>
      <button class="bouton beta-outil" data-outil="double" data-i18n-title="outil.double" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M7 17l3-5h5l2 5M10 12l2 5 3-5"/><path d="M3 5h8M8 2l3 3-3 3M21 9h-8M16 6l-3 3 3 3"/></svg>
        <span data-i18n="outil.double"></span> <kbd>5</kbd></button>
    </div>
    <div class="beta-groupe" data-groupe="transports" role="group" data-i18n-aria="groupe.transports">
      <span class="beta-groupe-nom" data-i18n="groupe.transports"></span>
      <button class="bouton beta-outil" data-outil="bus" data-i18n-title="outil.bus" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/></svg>
        <span data-i18n="outil.bus"></span> <kbd>7</kbd></button>
    </div>
    <div class="beta-groupe" data-groupe="carrefours" role="group" data-i18n-aria="groupe.carrefours">
      <span class="beta-groupe-nom" data-i18n="groupe.carrefours"></span>
      <button class="bouton beta-outil" data-outil="feux" data-i18n-title="outil.feux" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="16" rx="2"/><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="10" r="1.6"/><circle cx="12" cy="14" r="1.6"/><path d="M12 18v4"/></svg>
        <span data-i18n="outil.feux"></span> <kbd>6</kbd></button>
      <button class="bouton beta-outil" data-outil="giratoire" data-i18n-title="outil.giratoire" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        <span data-i18n="outil.giratoire"></span> <kbd>9</kbd></button>
      <button class="bouton beta-outil" data-outil="mouvements" data-i18n-title="outil.mouvements" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21v-7c0-4 4-6 8-6h3M16 5l3 3-3 3M8 14c0-3-2-5-5-5"/></svg>
        <span data-i18n="outil.mouvements"></span> <kbd>0</kbd></button>
    </div>
  </nav>

  <!-- Le panneau des feux du carrefour choisi (outil Feux) : rempli par js/beta/main.js -->
  <section class="beta-panneau-feux" id="panneau-feux" aria-live="polite" hidden></section>

  <div class="beta-actions">
    <button class="bouton icone-texte" id="annuler" disabled><span data-i18n="annuler"></span> <kbd>Ctrl Z</kbd></button>
    <button class="bouton icone-texte" id="retablir" disabled><span data-i18n="retablir"></span> <kbd>Ctrl Y</kbd></button>
    <button class="bouton" id="pause" aria-pressed="false"><span id="pause-texte" data-i18n="pause"></span> <kbd data-i18n-title="pause">␣</kbd></button>
    <button class="bouton" id="vitesse"><span id="vitesse-texte"></span> <kbd>X</kbd></button>
    <button class="bouton" id="ouvrir-menu" data-i18n="menu"></button>
  </div>

  <footer class="beta-pied">
    <p id="aide" aria-live="polite"></p>
    <p class="beta-camera" data-i18n="aide.camera"></p>
    <p class="beta-compte" id="compte" role="status"></p>
  </footer>

  <div class="jeu-chargement" id="chargement" role="status" aria-live="polite">
    <span class="jeu-chargement-barre" aria-hidden="true"></span>
    <p id="chargement-texte">Préparation de la carte…</p>
  </div>
</div>

<dialog id="dialogue-menu" data-i18n-aria="menu">
  <h2><span data-i18n="titre"></span> <small data-i18n="beta"></small></h2>
  <div class="menu">
    <button class="bouton" id="menu-reprendre" data-i18n="menu.reprendre"></button>
    <button class="bouton" id="menu-recentrer" data-i18n="menu.recentrer"></button>
    <button class="bouton" id="menu-nouvelle" data-i18n="menu.nouvelle"></button>
    <a class="bouton" href="./" data-i18n="menu.accueil"></a>
  </div>
</dialog>

<dialog id="dialogue-confirmer">
  <p data-i18n="confirmer.texte"></p>
  <form method="dialog" class="menu">
    <button class="bouton" value="oui" data-i18n="confirmer.oui"></button>
    <button class="bouton" value="non" data-i18n="confirmer.non"></button>
  </form>
</dialog>

<div class="jeu-toast" id="toast" role="status" hidden></div>
<script>
  (function () {
    var fini = function () { var c = document.getElementById('chargement'); return !c || c.hidden; };
    var dire = function (raison) {
      if (fini()) return;
      var t = document.getElementById('chargement-texte'), b = document.querySelector('#chargement .jeu-chargement-barre');
      if (b) b.hidden = true;
      if (t) t.textContent = 'La carte n\u2019a pas pu d\u00e9marrer : ' + raison + ' \u2014 rechargez avec Ctrl+Maj+R. / The map could not start: ' + raison + ' \u2014 reload with Ctrl+Shift+R.';
    };
    // Le navigateur signale main.js même quand c'est un module qu'il importe qui manque (ou qu'un bloqueur
    // de publicités refuse, vu en 0.6.0 avec « trafic.js ») : on suit les imports pour nommer le coupable.
    var sonder = function (url, vus) {
      if (vus[url]) return Promise.resolve(null);
      vus[url] = 1;
      return fetch(url).then(function (r) {
        if (!r.ok) return url + ' (HTTP ' + r.status + ')';
        return r.text().then(function (t) {
          var re = /^import\s[^'"]*['"](\.[^'"]+)['"]/gm, m, liste = []; // en début de ligne : pas les exemples en commentaire
          while ((m = re.exec(t))) liste.push(new URL(m[1], url).href);
          return liste.reduce(function (p, u) { return p.then(function (x) { return x || sonder(u, vus); }); }, Promise.resolve(null));
        });
      }, function () { return url + ' (bloqué : bloqueur de publicités ? / blocked: ad blocker?)'; });
    };
    var court = function (u) { return u.replace(location.href.replace(/[^/]*$/, ''), ''); };
    window.addEventListener('error', function (e) {
      var tag = e.target && e.target.tagName;
      if (tag && tag !== 'SCRIPT' && tag !== 'LINK') return; // une image manquante ne bloque rien
      var cible = e.target && e.target !== window ? (e.target.src || e.target.href) : null;
      if (!cible) { dire((e.message || 'erreur / error') + (e.filename ? ' (' + court(e.filename) + ':' + e.lineno + ')' : '')); return; }
      dire('fichier non chargé / file not loaded ' + court(cible));
      if (tag === 'SCRIPT') sonder(cible, {}).then(function (x) { if (x) dire('fichier non chargé / file not loaded ' + court(x)); });
    }, true);
    window.addEventListener('unhandledrejection', function (e) { dire(String((e.reason && e.reason.message) || e.reason)); });
    setTimeout(function () {
      if (fini()) return;
      var t = document.getElementById('chargement-texte');
      if (t && !/Ctrl/.test(t.textContent)) t.textContent += ' (30 s : si rien ne bouge, Ctrl+Maj+R / if nothing moves, Ctrl+Shift+R)';
    }, 30000);
  })();
</script>
<script type="module" src="js/beta/main.js?v=0.9.8"></script>
</body>
</html>
