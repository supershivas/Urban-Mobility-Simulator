<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E5DC">
<title>Urban Mobility Simulator — Carte blanche (bêta)</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="js/lib/game.css?v=0.9.0">
<link rel="stylesheet" href="css/beta.css?v=0.9.0">
</head>
<body>
<!-- Jeu beta « Carte blanche » (v0.9.0) : une carte vierge en 3D, une route, et ce que le joueur y construit.
     Ouvert depuis le bouton « Bêta » de l'écran titre (index.html). -->
<div class="jeu-ecran beta" id="ecran">
  <div class="beta-vue" id="vue" role="application" data-i18n-aria="scene.libelle" tabindex="0">
    <div class="beta-etiquette" id="etiquette" hidden></div>
  </div>

  <header class="beta-tete">
    <a class="bouton beta-retour" href="./" id="retour"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="retour"></span></a>
    <h1 class="beta-titre"><span data-i18n="titre"></span> <small data-i18n="beta"></small></h1>
    <span class="beta-version" id="version"></span>
  </header>

  <nav class="beta-outils" id="outils" role="toolbar" data-i18n-aria="outils.libelle">
    <button class="bouton beta-outil" data-outil="route" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-8 6-14 16-16"/><path class="tiret" d="M8 17c1-4 4-8 9-10"/></svg>
      <span data-i18n="outil.route"></span> <kbd>1</kbd></button>
    <button class="bouton beta-outil" data-outil="voies" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16M21 4v16M12 4v16"/><path class="tiret" d="M7.5 4v16M16.5 4v16"/></svg>
      <span data-i18n="outil.voies"></span> <kbd>2</kbd></button>
    <button class="bouton beta-outil" data-outil="velo" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="velo"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h6l2 7M10 9l2 7 4-7M15 6h3"/></svg>
      <span data-i18n="outil.velo"></span> <kbd>3</kbd></button>
  </nav>

  <div class="beta-actions">
    <button class="bouton icone-texte" id="annuler" disabled><span data-i18n="annuler"></span> <kbd>Ctrl Z</kbd></button>
    <button class="bouton icone-texte" id="retablir" disabled><span data-i18n="retablir"></span> <kbd>Ctrl Y</kbd></button>
    <button class="bouton" id="pause" aria-pressed="false"><span id="pause-texte" data-i18n="pause"></span> <kbd data-i18n-title="pause">␣</kbd></button>
    <button class="bouton" id="vitesse"><span id="vitesse-texte"></span> <kbd>X</kbd></button>
    <button class="bouton" id="ouvrir-menu" data-i18n="menu"></button>
  </div>

  <footer class="beta-pied">
    <p id="aide" aria-live="polite"></p>
    <p class="beta-camera" data-i18n="aide.camera"></p>
    <p class="beta-compte" id="compte" role="status"></p>
  </footer>

  <div class="jeu-chargement" id="chargement" role="status" aria-live="polite">
    <span class="jeu-chargement-barre" aria-hidden="true"></span>
    <p id="chargement-texte">Préparation de la carte…</p>
  </div>
</div>

<dialog id="dialogue-menu" data-i18n-aria="menu">
  <h2><span data-i18n="titre"></span> <small data-i18n="beta"></small></h2>
  <div class="menu">
    <button class="bouton" id="menu-reprendre" data-i18n="menu.reprendre"></button>
    <button class="bouton" id="menu-recentrer" data-i18n="menu.recentrer"></button>
    <button class="bouton" id="menu-nouvelle" data-i18n="menu.nouvelle"></button>
    <a class="bouton" href="./" data-i18n="menu.accueil"></a>
  </div>
</dialog>

<dialog id="dialogue-confirmer">
  <p data-i18n="confirmer.texte"></p>
  <form method="dialog" class="menu">
    <button class="bouton" value="oui" data-i18n="confirmer.oui"></button>
    <button class="bouton" value="non" data-i18n="confirmer.non"></button>
  </form>
</dialog>

<div class="jeu-toast" id="toast" role="status" hidden></div>
<script>
  // Filet de secours : si un module ne se charge pas, l'écran de chargement le dit au lieu de rester figé
  window.addEventListener('error', function (e) {
    var t = document.getElementById('chargement-texte'), c = document.getElementById('chargement');
    if (!c || c.hidden || !t) return;
    t.textContent = 'La carte n’a pas pu démarrer : ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'erreur') + ' — Ctrl+Maj+R. / The map could not start — Ctrl+Shift+R.';
  }, true);
</script>
<script type="module" src="js/beta/main.js?v=0.9.0"></script>
</body>
</html>
